name: MWD CI/CD

on:
  push:
    branches:
      - v2_developing

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 1. redis를 EC2에 다운받고 컨테이너를 띄운다.
    # 2. 깃 액션으로 빌드한 후 mwd 컨테이너 이미지를 올린다,
    # 3. EC2에서 이미지를 당겨온 후 실행한다.

    steps:
      - name: Github Repository에 올린 파일들을 불러오기
        uses: actions/checkout@v4

      - name: JDK 21버전 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: application.yml 파일 만들기
        run: echo "${{  secrets.APPLICATION_PROPERTIES  }}" > ./src/main/resources/application.yml

      - name: 테스트를 위한 redis 띄우기
        run: |
          docker pull redis
          docker run --name test-redis -d redis

      - name: 테스트 및 빌드하기
        run: |
          chmod +x ./gradlew
          ./gradlew build -x test

      - name: AWS credentials 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: ECR에 로그인
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: WAS - Docker 이미지 생성
        run: docker build -t mwd-server .

      - name: 이미지에 태그 붙이고 푸시
        run: |
          docker tag mwd-server ${{ steps.login-ecr.outputs.registry  }}/mwd-server:latest
          doekr push ${{ steps.login-ecr.outputs.registry  }}/mwd-server:latest

      - name: SSH로 EC2 접속 및 배포
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script_stop: true
          script: |
            docker pull ${{ steps.login-ecr.outputs.registry }}/mwd-server:latest
            docker-compose down
            docker-compose up -d

