name: MWD CI/CD

on:
  push:
    branches:
      - v2_developing

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Github Repository에 올린 파일들을 불러오기
        uses: actions/checkout@v4

      - name: JDK 21버전 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: application.yml 파일 만들기
        run: echo "${{  secrets.APPLICATION_PROPERTIES  }}" > ./src/main/resources/application.yml

      - name: 빌드하기
        run: |
          chmod +x ./gradlew
          ./gradlew build -x test

      - name: AWS credentials 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: ECR에 로그인
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: WAS - Docker 이미지 생성
        run: docker build -t mwd-server .

      - name: 이미지에 태그 붙이고 푸시
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry  }}
        run: |
          docker tag mwd-server ${ECR_REGISTRY}/mwd-server:latest
          docker push  ${ECR_REGISTRY}/mwd-server:latest

      - name: SSH로 EC2 접속 및 배포
        uses: appleboy/ssh-action@v1.0.0
        env:
          ECR_REGISTRY: ${{  steps.login-ecr.outputs.registry  }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script_stop: true
          script: |
            docker-compose down || true
            rm webapp.env || true
            echo "ECR_REGISTRY=${ECR_REGISTRY}" > ./webapp.env
            docker pull ${ECR_REGISTRY}/mwd-server:latest
            docker-compose up -e ECR_REGISTRY=${ECR_REGISTRY} --build -d
            

